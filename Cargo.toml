[workspace]
resolver = "3"
members = [
    "crates/tpt-soma-core",
    "crates/tpt-soma-capability",
    "crates/tpt-soma-audit",
    "crates/tpt-soma-ingest",
    "crates/tpt-soma-harmonize",
    "crates/tpt-soma-genomica",
    "crates/tpt-soma-cytos",
    "crates/tpt-soma-api",
]
exclude = ["frontend"]

[workspace.package]
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tpt-soma/tpt-soma"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
arrow = { version = "59", features = ["prettyprint"] }
arrow-flight = { version = "59" }
arrow-schema = "59"
tonic = { version = "0.12", features = ["tls", "transport"] }
prost = "0.13"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
bytes = "1.9"
futures = "0.3"
prometheus = { version = "0.13", features = ["process"] }
md5 = "0.7"
axum = { version = "0.8", features = ["macros", "multipart"] }
noodles = { version = "0.114" }
anndata = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
