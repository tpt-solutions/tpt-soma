[workspace]
resolver = "3"
members = [
    "crates/tpt-soma-core",
    "crates/tpt-soma-capability",
    "crates/tpt-soma-audit",
    "crates/tpt-soma-ingest",
    "crates/tpt-soma-harmonize",
    "crates/tpt-soma-genomica",
    "crates/tpt-soma-cytos",
    "crates/tpt-soma-api",
    "crates/tpt-soma-organon",
    "crates/tpt-soma-chronos",
    "crates/tpt-soma-simulacrum",
    "crates/tpt-soma-pathos",
    "crates/tpt-soma-clinica",
    "crates/tpt-soma-sandbox",
    "crates/tpt-soma-flight",
]
exclude = ["frontend"]

[workspace.package]
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "tpt-soma: multi-scale computational physiology platform"
repository = "https://github.com/tpt-soma/tpt-soma"
homepage = "https://github.com/tpt-soma/tpt-soma"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2.2", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tempfile = "3.2"
tonic = { version = "0.14", features = ["tls-native-roots", "transport"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1.9"
futures = "0.3"
md5 = "0.7"
axum = { version = "0.8", features = ["macros", "multipart"] }
noodles = { version = "0.114", features = ["vcf"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
clap = { version = "4.6", features = ["derive", "env"] }
hex = "0.4"
csv = "1.3"
anyhow = "1.0"
hdf5 = "0.8"
