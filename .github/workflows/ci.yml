name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Deny check
        run: cargo deny check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage summary (workspace floor 65% line coverage)
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex 'tests/|/tests/' \
            --fail-under-lines 65 \
            --summary-only
      - name: Upload lcov report
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex 'tests/|/tests/' \
            --lcov --output-path lcov.info
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lcov.info

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm ci
      - name: API types match the OpenAPI spec
        run: |
          cd frontend && npm run gen:api
          git diff --exit-code -- src/api/schema.ts
      - run: cd frontend && npx tsc -b
      - run: cd frontend && npx eslint .
      - run: cd frontend && npx vitest run

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/tpt-soma
      - run: |
          # render with a dummy capability key to exercise the secret + mounts
          helm template tpt-soma deploy/helm/tpt-soma \
            --set capability.rootKeyBase64=Y2ktZHVtbXkta2V5LWJhc2U2NC1kYXRh > /tmp/rendered.yaml
      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: tpt-soma
      - name: Validate against kind cluster
        run: |
          kubectl version --client
          # dry-run install validates the chart against a live Kubernetes API
          # (templates, RBAC, secret/PVC resources) without pulling images.
          helm install tpt-soma deploy/helm/tpt-soma \
            --set keystone.auth.bootstrapPassword=ci-pass \
            --set minio.rootPassword=ci-minio-pass \
            --set api.env.databaseUrl=postgres://admin:ci-pass@keystone:5432/tpt_soma \
            --set flight.env.databaseUrl=postgres://admin:ci-pass@keystone:5432/tpt_soma \
            --set capability.rootKeyBase64=Y2ktZHVtbXkta2V5LWJhc2U2NC1kYXRh \
            --dry-run=client \
            --debug
          # resources parse and validate against the live cluster API schema
          kubectl apply --dry-run=server -f /tmp/rendered.yaml

  schemas:
    name: Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check protobuf compile
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --proto_path=schemas/protobuf schemas/protobuf/*.proto --python_out=/tmp/schema_py --rust_out=/tmp/schema_rs

  audit-database:
    name: Audit ledger (PostgreSQL)
    runs-on: ubuntu-latest
    # Plain PostgreSQL with the audit table only. The Keystone-backed migrations
    # need the private tpt-keystone image, so those tests run elsewhere.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tpt_soma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tpt_soma_test
      TEST_SKIP_MIGRATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Apply audit schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d tpt_soma_test -v ON_ERROR_STOP=1 \
            -f crates/tpt-soma-core/migrations/20240101000001_init_audit.sql \
            -f crates/tpt-soma-core/migrations/20240101000011_audit_chain_seq.sql
      - name: Audit chain, concurrency and DP-budget restore
        # One thread: the tests share a table and delete rows between cases.
        run: |
          cargo test -p tpt-soma-audit -- --include-ignored --test-threads=1
          cargo test -p tpt-soma-api --lib db_tests -- --include-ignored --test-threads=1

  sandbox-wasmtime:
    name: Sandbox (wasmtime backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tpt-soma-sandbox --features wasmtime-backend

  keystone-db:
    name: Keystone DB (full --ignored suite)
    # Runs only when the KEYSTONE_GHCR_TOKEN secret is set (the image is private).
    # Without it every step is skipped and a notice is printed, so the job stays green.
    runs-on: ubuntu-latest
    env:
      KEYSTONE_GHCR_TOKEN: ${{ secrets.KEYSTONE_GHCR_TOKEN }}
      KEYSTONE_PASSWORD: ci-pass
    steps:
      - name: Skip notice
        if: env.KEYSTONE_GHCR_TOKEN == ''
        run: echo "::notice::KEYSTONE_GHCR_TOKEN is not set; the Keystone DB suite was skipped."
      - uses: actions/checkout@v4
        if: env.KEYSTONE_GHCR_TOKEN != ''
      - uses: dtolnay/rust-toolchain@stable
        if: env.KEYSTONE_GHCR_TOKEN != ''
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        if: env.KEYSTONE_GHCR_TOKEN != ''
      - name: Start Keystone
        if: env.KEYSTONE_GHCR_TOKEN != ''
        run: |
          echo "$KEYSTONE_GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name keystone -p 5432:5432 \
            -e TPT_AUTH_BOOTSTRAP_USER=admin \
            -e TPT_AUTH_BOOTSTRAP_PASSWORD=$KEYSTONE_PASSWORD \
            -e POSTGRES_PASSWORD=$KEYSTONE_PASSWORD \
            ghcr.io/tpt-keystone-db/tpt-keystone:latest
          for i in $(seq 1 60); do
            pg_isready -h localhost -p 5432 -U admin && break
            sleep 2
          done
      - name: Create test database
        if: env.KEYSTONE_GHCR_TOKEN != ''
        env:
          PGPASSWORD: ${{ env.KEYSTONE_PASSWORD }}
        run: psql -h localhost -U admin -d postgres -c "CREATE DATABASE tpt_soma"
      - name: Full --ignored suite
        if: env.KEYSTONE_GHCR_TOKEN != ''
        env:
          TEST_DATABASE_URL: postgres://admin:ci-pass@localhost:5432/tpt_soma
        # One thread: the tests share tables and delete rows between cases.
        run: cargo test --workspace -- --include-ignored --test-threads=1
