[package]
name = "tpt-soma-harmonize"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic ontology mapping (dbSNP rsID, HGNC, LOINC, SNOMED) with human-in-the-loop review."
readme = "README.md"
keywords = ['harmonization', 'ontology', 'mapping']
categories = ['science']

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
csv = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }

[[bin]]
name = "review-cli"
path = "src/bin/review_cli.rs"
