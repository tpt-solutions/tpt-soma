[package]
name = "tpt-soma-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Append-only, hash-chained compliance audit ledger."
readme = "README.md"
keywords = ['audit', 'compliance', 'hipaa', 'gdpr', 'ledger']
categories = ['cryptography', 'science']

[[bin]]
name = "tpt-soma-audit"
path = "src/bin/audit_cli.rs"

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
tpt-soma-core = { path = "../tpt-soma-core", version = "0.1.0" }

[dev-dependencies]
tokio-test = "0.4"
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tpt-soma-core = { path = "../tpt-soma-core", version = "0.1.0" }
