[package]
name = "tpt-soma-audit"
version = "0.1.0"
edition = "2024"
description = "Append-only hash-chained audit ledger over Keystone"
authors = ["tpt-soma contributors"]

[[bin]]
name = "tpt-soma-audit"
path = "src/bin/audit_cli.rs"

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
tpt-soma-core = { path = "../tpt-soma-core" }

[dev-dependencies]
tokio-test = "0.4"
