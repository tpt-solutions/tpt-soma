[package]
name = "tpt-soma-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP + Arrow Flight API server with capability/audit/differential-privacy enforcement."
readme = "README.md"
keywords = ['api', 'arrow-flight', 'grpc', 'web', 'physiology']
categories = ['web-programming', 'science']

[dependencies]
tokio = { workspace = true }
tonic = { workspace = true }
arrow = { workspace = true }
arrow-flight = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
tokio-stream = "0.1"
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
sqlx = { workspace = true }
tpt-soma-core = { path = "../tpt-soma-core", version = "0.1.0" }
tpt-soma-capability = { path = "../tpt-soma-capability", version = "0.1.0" }
tpt-soma-audit = { path = "../tpt-soma-audit", version = "0.1.0" }
tpt-soma-genomica = { path = "../tpt-soma-genomica", version = "0.1.0" }
tpt-soma-cytos = { path = "../tpt-soma-cytos", version = "0.1.0" }
tpt-soma-ingest = { path = "../tpt-soma-ingest", version = "0.1.0" }
tpt-soma-organon = { path = "../tpt-soma-organon", version = "0.1.0" }
tpt-soma-chronos = { path = "../tpt-soma-chronos", version = "0.1.0" }
csv = { workspace = true }
md5 = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { workspace = true }

[[bin]]
name = "tpt-soma-api"
path = "src/main.rs"

[[bin]]
name = "tpt-soma-flight"
path = "src/flight_main.rs"

[[bin]]
name = "tpt-soma-admin"
path = "src/bin/admin.rs"
