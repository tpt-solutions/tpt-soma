[package]
name = "tpt-soma-flight"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "In-house columnar batches, Arrow-compatible IPC, and Flight gRPC (no Apache-2.0-only dependencies)."
keywords = ['flight', 'grpc', 'columnar', 'ipc']
categories = ['encoding', 'network-programming']

[features]
# The gRPC server and client need tonic. Turn `service` off to use only the
# columnar, IPC and protobuf parts, which have no tonic dependency.
default = ["service"]
service = ["dep:tonic"]

[dependencies]
tonic = { workspace = true, optional = true }
bytes = { workspace = true }
thiserror = { workspace = true }

[[example]]
name = "interop_server"
required-features = ["service"]

[dev-dependencies]
tokio = { workspace = true }
tokio-stream = "0.1"
futures = { workspace = true }
