[package]
name = "tpt-soma-genomica"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Genomic variant annotation and harmonization."
readme = "README.md"
keywords = ['genomics', 'variants', 'vcf']
categories = ['science']

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tpt-soma-core = { path = "../tpt-soma-core", version = "0.1.0" }
tpt-soma-capability = { path = "../tpt-soma-capability", version = "0.1.0" }
tpt-soma-audit = { path = "../tpt-soma-audit", version = "0.1.0" }
tpt-soma-ingest = { path = "../tpt-soma-ingest", version = "0.1.0" }
tpt-soma-harmonize = { path = "../tpt-soma-harmonize", version = "0.1.0" }

[dev-dependencies]
tokio-test = "0.4"
