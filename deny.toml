[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
version = 2
deny = [{ name = "openssl" }]
multiple-versions = "warn"

[sources]
version = 2
required-git-signature = "false"
