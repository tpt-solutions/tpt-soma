[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.8
# "Apache-2.0" is deliberately NOT in `allow`: dual-licensed `MIT OR Apache-2.0`
# crates still pass via MIT, while Apache-only crates fail unless listed below.
# This keeps a pure-MIT dependency chain possible. Each exception is an
# unavoidable Apache-only crate; shrink this list, never grow it casually.
exceptions = [
    # Required by tower, axum, tonic and reqwest.
    { allow = ["Apache-2.0"], crate = "sync_wrapper" },
    # rustls crypto backend (Apache-2.0 AND ISC).
    { allow = ["Apache-2.0", "ISC"], crate = "ring" },
]

[bans]
deny = [{ name = "openssl" }]
multiple-versions = "warn"

