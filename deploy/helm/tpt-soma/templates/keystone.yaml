{{- if .Values.keystone.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tpt-soma.fullname" . }}-keystone
  labels:
    {{- include "tpt-soma.labels" . | nindent 4 }}
    app.kubernetes.io/component: keystone
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tpt-soma.name" . }}
      app.kubernetes.io/component: keystone
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tpt-soma.name" . }}
        app.kubernetes.io/component: keystone
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "tpt-soma.labels" . | nindent 8 }}
    spec:
      containers:
        - name: keystone
          image: "{{ .Values.keystone.image.repository }}:{{ .Values.keystone.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
            - name: http
              containerPort: 5435
              protocol: TCP
            - name: metrics
              containerPort: 9187
              protocol: TCP
          env:
            - name: TPT_AUTH_BOOTSTRAP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "tpt-soma.fullname" . }}-keystone-secrets
                  key: bootstrap-user
            - name: TPT_AUTH_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tpt-soma.fullname" . }}-keystone-secrets
                  key: bootstrap-password
          volumeMounts:
            - name: tpt-data
              mountPath: /var/lib/keystone/tpt-data
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tpt-data
          persistentVolumeClaim:
            claimName: {{ include "tpt-soma.fullname" . }}-keystone-pvc
{{- end }}
