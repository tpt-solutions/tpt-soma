{{- if .Values.keystone.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tpt-soma.fullname" . }}-keystone-secrets
  labels:
    {{- include "tpt-soma.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap-user: {{ .Values.keystone.auth.bootstrapUser | quote }}
  bootstrap-password: {{ .Values.keystone.auth.bootstrapPassword | quote }}
{{- end }}
{{- if .Values.capability.rootKeyBase64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tpt-soma.fullname" . }}-capability-secrets
  labels:
    {{- include "tpt-soma.labels" . | nindent 4 }}
type: Opaque
binaryData:
  capability_root_key: {{ .Values.capability.rootKeyBase64 | quote }}
{{- end }}
